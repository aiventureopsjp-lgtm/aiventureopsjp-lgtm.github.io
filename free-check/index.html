<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無料 Bid/No-Bid チェック | BidScope AI</title><meta name="description" content="入札・公共調達案件に参加すべきかを8項目で無料セルフチェック。案件適合度、参加推奨・要確認・見送りの目安を端末内だけで算出します。"><style>body{max-width:860px;margin:36px auto;padding:0 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Yu Gothic',sans-serif;line-height:1.75;color:#182033}h1{font-size:38px;line-height:1.2}.card{border:1px solid #e5e7eb;border-radius:14px;padding:18px;margin:14px 0}.q{font-weight:700;margin-bottom:8px}select{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:16px}button,.cta{background:#182033;color:#fff;border:0;border-radius:10px;padding:13px 18px;font-size:16px;font-weight:700;text-decoration:none;display:inline-block;cursor:pointer}.result{display:none;background:#f5f8ff;border-radius:14px;padding:22px;margin-top:22px}.score{font-size:42px;font-weight:800}.small{font-size:14px;color:#667085}a{color:#244fbf}</style></head><body><h1>無料 Bid/No-Bid チェック</h1><p>入札・公共調達案件を詳細に読む前に、8項目で「参加推奨・要確認・見送り」の目安を確認できます。入力内容は外部送信されません。</p><div id="qs"></div><button onclick="calc()">無料で判定する</button><div id="res" class="result"><div id="score" class="score"></div><h2 id="judge"></h2><p id="comment"></p><p><a class="cta" href="/bidscope/">企業別の案件診断を見る</a></p><p class="small">この無料判定は一般的な一次チェックです。入札参加資格や受注可能性を保証しません。</p></div><script>const data=[['案件内容が自社の主要サービスと一致する','strong'],['納期・実施期間に対応できる','strong'],['対象地域で業務提供できる','medium'],['必要資格・認証を満たす、または不要','strong'],['類似案件の実績を説明できる','medium'],['予算規模が自社の受注レンジに合う','medium'],['提出期限までに提案・書類準備が可能','strong'],['競争条件や契約条件に重大な懸念がない','strong']];const box=document.getElementById('qs');data.forEach((x,i)=>{box.insertAdjacentHTML('beforeend',`<div class="card"><div class="q">${i+1}. ${x[0]}</div><select id="q${i}"><option value="">選択してください</option><option value="2">はい</option><option value="1">一部・要確認</option><option value="0">いいえ</option></select></div>`)});function calc(){let s=0,n=0;for(let i=0;i<data.length;i++){let v=document.getElementById('q'+i).value;if(v===''){alert('8項目すべて回答してください');return;}s+=Number(v);n+=2;}let pct=Math.round(s/n*100),j,c;if(pct>=75){j='参加推奨';c='案件との基本適合度は高めです。資格・仕様・契約条件を正式資料で確認し、提案準備へ進む価値があります。'}else if(pct>=50){j='要確認';c='検討余地はありますが、不足条件やリスク確認が必要です。特に「いいえ」「一部」とした項目を先に確認してください。'}else{j='見送り寄り';c='現時点では適合度が低めです。無理に提案工数を使わず、より自社に合う案件探索を優先する方が合理的です。'}document.getElementById('score').textContent=pct+' / 100';document.getElementById('judge').textContent=j;document.getElementById('comment').textContent=c;document.getElementById('res').style.display='block';location.hash='res'}</script><hr><p><a href="/bidscope/">BidScope AI</a> · <a href="/legal/">特定商取引法に基づく表記</a> · <a href="/">プライバシーポリシー</a></p></body></html>
