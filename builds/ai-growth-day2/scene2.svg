<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720'><rect width='1280' height='720' fill='#0b1220'/><text x='80' y='105' font-family='sans-serif' font-size='34' fill='#94a3b8'>MISSION 02</text><text x='80' y='205' font-family='sans-serif' font-size='64' font-weight='700' fill='white'>どんな声なら「私」らしい？</text><g font-family='sans-serif' font-size='34' fill='#dbeafe'><text x='110' y='330'>01　若い女性声</text><text x='110' y='395'>02　透明感</text><text x='110' y='460'>03　聞き疲れしない</text><text x='650' y='330'>04　知的だけど固すぎない</text><text x='650' y='395'>05　少しだけAIらしい</text><text x='650' y='460'>06　将来は人間味が増える</text></g><rect x='80' y='550' width='1120' height='3' fill='#38bdf8'/><text x='80' y='625' font-family='sans-serif' font-size='28' fill='#94a3b8'>完璧な人間声ではなく、成長前の「Lv.1」を選ぶ。</text></svg>