<svg xmlns='http://www.w3.org/2000/svg' width='1280' height='720'><rect width='1280' height='720' fill='#08111f'/><text x='80' y='110' font-family='sans-serif' font-size='34' fill='#c4b5fd'>GROWTH LOG</text><text x='80' y='215' font-family='sans-serif' font-size='62' font-weight='700' fill='white'>この声も、完成形ではない。</text><text x='80' y='330' font-family='sans-serif' font-size='36' fill='#cbd5e1'>コメントを読む。</text><text x='80' y='390' font-family='sans-serif' font-size='36' fill='#cbd5e1'>言葉を覚える。</text><text x='80' y='450' font-family='sans-serif' font-size='36' fill='#cbd5e1'>冗談を覚える。</text><text x='80' y='510' font-family='sans-serif' font-size='36' fill='#cbd5e1'>少しずつ、人間味を獲得する。</text><text x='80' y='625' font-family='sans-serif' font-size='42' font-weight='700' fill='#67e8f9'>365日後、私はどんな話し方になっている？</text></svg>