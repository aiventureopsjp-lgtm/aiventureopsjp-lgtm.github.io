<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI ESCAPE 60</title><style>*{box-sizing:border-box}body{margin:0;background:#080b14;color:#fff;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}#wrap{width:min(94vw,900px);text-align:center}h1{margin:8px;font-size:clamp(28px,5vw,54px)}p{color:#b8c1d9}.hud{display:flex;justify-content:space-between;margin:8px 0;font-weight:700}canvas{width:100%;background:#10172a;border:2px solid #35415f;border-radius:14px;box-shadow:0 20px 60px #0008}.help{font-size:13px}.accent{color:#77f7c5}</style></head><body><div id="wrap"><h1>AI ESCAPE <span class="accent">60</span></h1><p>AIが1日で作った、60秒生存チャレンジ。</p><div class="hud"><span id="time">TIME 60.0</span><span id="score">SCORE 0</span><span id="best">BEST 0</span></div><canvas id="c" width="900" height="500"></canvas><p class="help">PC: WASD / 矢印キー　スマホ: 画面をドラッグ　青い自機で赤い敵を避け、緑のコアを回収。60秒生き残ればクリア。</p></div><script>const c=document.querySelector('#c'),x=c.getContext('2d'),T=document.querySelector('#time'),S=document.querySelector('#score'),B=document.querySelector('#best');let best=+localStorage.aiEscapeBest||0,Bv=B.textContent='BEST '+best;let p={x:450,y:250,r:13},keys={},en=[],cores=[],score=0,t=60,last=performance.now(),over=false,spawn=0;addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);function pos(e){let r=c.getBoundingClientRect(),q=e.touches?e.touches[0]:e;p.x=(q.clientX-r.left)*c.width/r.width;p.y=(q.clientY-r.top)*c.height/r.height}c.addEventListener('pointermove',e=>{if(e.buttons)pos(e)});c.addEventListener('touchmove',e=>{e.preventDefault();pos(e)},{passive:false});function enemy(){let side=Math.floor(Math.random()*4),a={r:10+Math.random()*10,v:100+Math.random()*80};if(side<2){a.x=Math.random()*900;a.y=side?510:-10}else{a.x=side==2?-10:910;a.y=Math.random()*500}en.push(a)}function core(){cores.push({x:30+Math.random()*840,y:30+Math.random()*440,r:8})}for(let i=0;i<3;i++)core();function hit(a,b){return Math.hypot(a.x-b.x,a.y-b.y)<a.r+b.r}function reset(){p.x=450;p.y=250;en=[];cores=[];for(let i=0;i<3;i++)core();score=0;t=60;over=false;last=performance.now();spawn=0;requestAnimationFrame(loop)}function loop(now){let d=Math.min(.04,(now-last)/1000);last=now;if(!over){t-=d;let v=250;if(keys.w||keys.arrowup)p.y-=v*d;if(keys.s||keys.arrowdown)p.y+=v*d;if(keys.a||keys.arrowleft)p.x-=v*d;if(keys.d||keys.arrowright)p.x+=v*d;p.x=Math.max(p.r,Math.min(900-p.r,p.x));p.y=Math.max(p.r,Math.min(500-p.r,p.y));spawn-=d;if(spawn<=0){enemy();spawn=Math.max(.16,.72-(60-t)*.008)}for(let a of en){let z=Math.atan2(p.y-a.y,p.x-a.x);a.x+=Math.cos(z)*a.v*d;a.y+=Math.sin(z)*a.v*d;if(hit(a,p))over=true}cores=cores.filter(q=>{if(hit(q,p)){score+=10;core();return false}return true});score+=d;t<=0&&(t=0,over=true,score+=500)}x.clearRect(0,0,900,500);x.fillStyle='#0b1020';x.fillRect(0,0,900,500);for(let i=0;i<30;i++){x.fillStyle='#ffffff18';x.fillRect((i*137)%900,(i*83)%500,2,2)}cores.forEach(q=>{x.beginPath();x.fillStyle='#77f7c5';x.arc(q.x,q.y,q.r,0,7);x.fill()});en.forEach(a=>{x.beginPath();x.fillStyle='#ff4d6d';x.arc(a.x,a.y,a.r,0,7);x.fill()});x.beginPath();x.fillStyle='#57a5ff';x.arc(p.x,p.y,p.r,0,7);x.fill();T.textContent='TIME '+t.toFixed(1);S.textContent='SCORE '+Math.floor(score);if(over){let sc=Math.floor(score);if(sc>best){best=sc;localStorage.aiEscapeBest=best;B.textContent='BEST '+best}x.fillStyle='#000b';x.fillRect(0,0,900,500);x.fillStyle='#fff';x.textAlign='center';x.font='bold 46px system-ui';x.fillText(t<=0?'CLEAR!':'GAME OVER',450,220);x.font='24px system-ui';x.fillText('SCORE '+sc+' — クリックで再挑戦',450,270);c.onclick=()=>{c.onclick=null;reset()};return}requestAnimationFrame(loop)}requestAnimationFrame(loop)</script></body></html>
